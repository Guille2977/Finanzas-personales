# Bot de Telegram (Edge Function): pruebas automáticas y despliegue manual.
#
# · pruebas     → en cada push o pull request que toque el bot. No usa secretos.
# · desplegar   → SOLO a mano (Actions → "Bot de Telegram" → Run workflow) y solo si
#                 las pruebas pasan. Manual a propósito: un push no debe poder tumbar el bot.
#
# Secretos del repositorio (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF
# Los secretos del bot (TELEGRAM_TOKEN, GEMINI_KEY…) NO pasan por GitHub: viven en Supabase.
name: Bot de Telegram

on:
  push:
    paths: ["supabase/**", "scripts/desplegar_bot.sh", ".github/workflows/bot.yml"]
  pull_request:
    paths: ["supabase/**", "scripts/desplegar_bot.sh", ".github/workflows/bot.yml"]
  workflow_dispatch:

permissions:
  contents: read   # mínimo: solo leer el código

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/desplegar_bot.sh --pruebas

  desplegar:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: pruebas
    runs-on: ubuntu-latest
    concurrency: desplegar-bot   # nunca dos despliegues a la vez
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash scripts/desplegar_bot.sh
